name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  # The secret scan reads the pull request it is scanning through the API.
  pull-requests: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:security
      - run: npm run build
      - run: npm audit --audit-level=high
      # Gitleaks refuses to scan a pull request without a token to read it with, so the step failed
      # on every pull request this repository has ever opened — which meant the one check standing
      # between a leaked key and a public repository was never actually running where it matters.
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The public entrances — student, teacher and parent — are what a stranger can reach, so they
      # are checked on every push rather than by hand before a release.
      - run: npm run test:e2e:student
