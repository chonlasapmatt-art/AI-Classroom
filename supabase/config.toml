project_id = "ai-smart-classroom"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:4173"
additional_redirect_urls = [
  "http://127.0.0.1:4173",
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "http://localhost:5174",
  "http://127.0.0.1:5174"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "ยืนยันอีเมล Smart Classroom"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "ลิงก์เข้าสู่ Smart Classroom"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "รหัส OTP สำหรับตั้งรหัสผ่าน Smart Classroom"
content_path = "./supabase/templates/recovery.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.sync-push]
verify_jwt = true
[functions.first-school-setup]
verify_jwt = true
[functions.admin-access]
verify_jwt = true
[functions.member-invitation]
verify_jwt = true
[functions.account-onboarding]
verify_jwt = true
[functions.parent-link]
verify_jwt = true
[functions.line-notify]
verify_jwt = false
# Students have no account to hold a JWT before they sign in, so this endpoint is reached
# unauthenticated and does its own rate limiting, lockout and opaque-failure handling instead.
[functions.student-access]
verify_jwt = false
[functions.member-access]
verify_jwt = false
# Issuing, reading and revoking a school's teacher code are all acts of a signed-in administrator,
# so the platform verifies the JWT before the function runs and the function checks the school.
[functions.teacher-code]
verify_jwt = true
