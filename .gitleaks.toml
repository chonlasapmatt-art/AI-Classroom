# What the secret scan is allowed to ignore, and why.
#
# The scan is the one check standing between a leaked key and a public repository, so it has to be a
# check people read. Four findings in this tree are not secrets, and left unexplained they would make
# every run red — and a check that is always red is a check nobody looks at, which is strictly worse
# than not having one.
#
# Nothing here is broad. A finding is ignored only when its own line matches one of two exact shapes.
# It deliberately does not name files: exempting a path would exempt a whole Edge Function, and a
# real key hardcoded in one of those is precisely what this scan exists to catch.

[extend]
useDefault = true

[[allowlists]]
description = """
Two shapes, neither a secret.

Character alphabets (KEY_ALPHABET, PASSWORD_ALPHABET): the set of characters a generated code may
contain, not a value. 'ABCDEFGHJKLMNPQRSTWXYZ23456789' is every unambiguous letter and digit exactly
once, which is precisely what entropy scoring is built to flag — long, no repeats, mixed with digits.
What they generate is shown once and never written to this repository.

The end-to-end placeholders: the student suite asserts what an unconfigured deployment shows, so its
build is handed a URL and a key that deliberately point nowhere. A real project reference here would
be the bug; the obviously fake string is the fix.
"""
regexTarget = "line"
regexes = [
  '''(?i)(KEY|PASSWORD|CODE)_ALPHABET\s*=\s*.?['"][A-Za-z0-9]{20,80}['"]''',
  '''e2e-placeholder'''
]
